<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }

<body class="min-h-screen flex items-center justify-center p-6 antialiased font-body relative overflow-hidden bg-background">
<!-- Ambient background element for soft texture -->
<div aria-hidden="true" class="absolute inset-0 z-0 bg-surface-container-low opacity-50 blur-[100px] rounded-full transform scale-150"></div>
<main class="w-full max-w-md relative z-10 flex flex-col items-center gap-12">
<!-- Brand / Identity -->
<div class="text-center space-y-4">
<h1 class="font-headline font-extrabold text-5xl tracking-tight text-primary italic">Nudg</h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed">Focus on what matters.</p>
</div>
<!-- Authentication Container -->
<div class="w-full space-y-6">
<!-- Social Login Buttons Container -->
<div class="flex flex-col gap-4 w-full">
<!-- Google Login -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest text-on-surface py-4 px-6 rounded-xl hover:bg-surface-container-high transition-colors duration-400 ease-out font-medium text-lg relative" style="box-shadow: 0px 12px 32px rgba(42, 52, 51, 0.06);">
<img alt="Google logo" class="w-6 h-6 object-contain rounded-full" data-alt="Small colorful google G logo icon isolated on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3hWP-kvGm3GlzNYb3zN7V4C3KDGstdMBMkD49nNSB95BRkH4a9cahoO4PJqyyMADKPzp8_VH08JxYYKsOUtRnmV8F2y7rbue7Pf0XpSM-qvd1Z7eOWFmJUMtR6C9EPFEtBHT2YgVQ4qXrAkbRuflmF4WLepK0hQV1LGd4RdKp_W-ZW2Ezdpz5uIJBgdpAW-n0Fl8PyZUOnNQlp0T3HCrOIORV1OrvWAq89UV06p1UI3Dnb8A4PeRx4dC-vxKhUPuSPAWYaWHT8LI"/>
<span>Continue with Google</span>
</button>
<!-- Apple Login -->
<button class="w-full flex items-center justify-center gap-3 bg-on-surface text-surface py-4 px-6 rounded-xl hover:bg-on-background/90 transition-colors duration-400 ease-out font-medium text-lg relative" style="box-shadow: 0px 12px 32px rgba(42, 52, 51, 0.06);">
<span class="material-symbols-outlined text-2xl" data-icon="apple">ios</span>
<span>Continue with Apple</span>
</button>
</div>
<!-- Optional: Alternative action, kept minimal -->
<div class="text-center pt-8">
<a class="text-sm font-label text-on-surface-variant hover:text-primary transition-colors duration-400" href="#">Having trouble? Get help.</a>
</div>
</div>
</main>
