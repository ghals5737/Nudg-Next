<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Routine - Serene Focus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#e1eae8",
                    "tertiary-dim": "#28596d",
                    "outline": "#727d7b",
                    "on-tertiary-fixed": "#0a4356",
                    "on-primary-container": "#00534d",
                    "surface-container-highest": "#d9e5e2",
                    "secondary-dim": "#3f5855",
                    "surface-tint": "#006b64",
                    "surface-dim": "#d1dcda",
                    "surface-bright": "#f6faf8",
                    "on-error-container": "#6e0a12",
                    "on-surface": "#2a3433",
                    "tertiary-fixed": "#b7e7ff",
                    "secondary-fixed": "#cce8e4",
                    "on-secondary-container": "#3d5653",
                    "surface-container-low": "#eef5f3",
                    "tertiary-container": "#b7e7ff",
                    "secondary-fixed-dim": "#bedad6",
                    "inverse-primary": "#7fe6db",
                    "primary-dim": "#005e57",
                    "on-tertiary-container": "#24566a",
                    "surface": "#f6faf8",
                    "primary": "#006b64",
                    "tertiary-fixed-dim": "#a9d8f0",
                    "surface-variant": "#d9e5e2",
                    "tertiary": "#356579",
                    "inverse-on-surface": "#999e9c",
                    "error": "#a83836",
                    "on-primary": "#e2fffa",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#f3faff",
                    "secondary": "#4a6461",
                    "outline-variant": "#a9b4b2",
                    "error-container": "#fa746f",
                    "inverse-surface": "#0a0f0e",
                    "on-background": "#2a3433",
                    "background": "#f6faf8",
                    "on-tertiary-fixed-variant": "#2f5f74",
                    "primary-fixed-dim": "#71d7cd",
                    "on-surface-variant": "#56615f",
                    "on-secondary-fixed": "#2b4441",
                    "surface-container": "#e7f0ed",
                    "on-primary-fixed-variant": "#005d57",
                    "secondary-container": "#cce8e4",
                    "on-secondary-fixed-variant": "#47605d",
                    "primary-fixed": "#7fe6db",
                    "on-error": "#fff7f6",
                    "primary-container": "#7fe6db",
                    "on-primary-fixed": "#003e39",
                    "error-dim": "#67040d",
                    "on-secondary": "#e2fffa"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .signature-gradient {
            background: linear-gradient(135deg, #006b64 0%, #7fe6db 100%);
        }
        .ambient-shadow {
            box-shadow: 0px 12px 32px rgba(42, 52, 51, 0.06);
        }
        .ghost-border {
            box-shadow: inset 0 0 0 2px rgba(0, 107, 100, 0.15);
        }
        .ghost-border:focus-within {
            box-shadow: inset 0 0 0 2px #006b64, 0 0 15px rgba(0, 107, 100, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">
<!-- Top Navigation for Web (Hidden on Mobile) -->
<nav class="hidden md:flex justify-between items-center px-8 py-4 w-full max-w-7xl mx-auto fixed top-0 w-full z-50 bg-surface-container-low/70 backdrop-blur-2xl transition-all duration-400 ease-out">
<div class="text-2xl font-bold tracking-tighter text-primary">
            Serene Focus
        </div>
<div class="flex items-center gap-6">
<a class="text-primary-dim hover:opacity-80 transition-opacity duration-400 font-semibold text-lg" href="#">Create</a>
<button class="text-primary-dim hover:opacity-80 transition-opacity duration-400">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="max-w-2xl mx-auto pt-12 md:pt-32 px-6">
<!-- Header Section -->
<header class="mb-12 md:mb-16">
<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-on-surface mb-4">New Routine</h1>
<p class="text-lg text-on-surface-variant leading-relaxed">Establish a gentle rhythm. What habit would you like to nurture?</p>
</header>
<!-- Form Section -->
<form class="space-y-12">
<!-- Routine Name Input -->
<div class="flex flex-col gap-3">
<label class="text-xl font-semibold text-on-surface tracking-tight" for="routine-name">Name</label>
<div class="relative ghost-border rounded-xl bg-surface-container-lowest transition-all duration-400">
<input class="w-full bg-transparent border-none rounded-xl px-6 py-5 text-lg text-on-surface focus:ring-0 placeholder-inverse-on-surface transition-colors" id="routine-name" placeholder="e.g. Morning Hydration" type="text"/>
</div>
</div>
<!-- Days of the Week Selection -->
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<label class="text-xl font-semibold text-on-surface tracking-tight">Schedule</label>
<span class="text-sm text-on-surface-variant bg-surface-container-low px-3 py-1 rounded-full">Everyday</span>
</div>
<div class="flex justify-between items-center bg-surface-container-low p-4 rounded-xl">
<!-- Day Circles -->
<button class="w-12 h-12 rounded-full bg-primary text-on-primary font-semibold text-lg flex items-center justify-center ambient-shadow hover:opacity-90 transition-all" type="button">M</button>
<button class="w-12 h-12 rounded-full bg-primary text-on-primary font-semibold text-lg flex items-center justify-center ambient-shadow hover:opacity-90 transition-all" type="button">T</button>
<button class="w-12 h-12 rounded-full bg-primary text-on-primary font-semibold text-lg flex items-center justify-center ambient-shadow hover:opacity-90 transition-all" type="button">W</button>
<button class="w-12 h-12 rounded-full bg-primary text-on-primary font-semibold text-lg flex items-center justify-center ambient-shadow hover:opacity-90 transition-all" type="button">T</button>
<button class="w-12 h-12 rounded-full bg-primary text-on-primary font-semibold text-lg flex items-center justify-center ambient-shadow hover:opacity-90 transition-all" type="button">F</button>
<button class="w-12 h-12 rounded-full bg-surface-container-highest text-on-surface-variant font-medium text-lg flex items-center justify-center hover:bg-surface-variant transition-all" type="button">S</button>
<button class="w-12 h-12 rounded-full bg-surface-container-highest text-on-surface-variant font-medium text-lg flex items-center justify-center hover:bg-surface-variant transition-all" type="button">S</button>
</div>
</div>
<!-- Smart Reminders Toggle -->
<div class="flex flex-col gap-4 bg-surface-container-low p-6 rounded-xl relative overflow-hidden">
<!-- Decorative subtle blur -->
<div class="absolute -right-10 -top-10 w-32 h-32 bg-primary-container rounded-full opacity-20 blur-2xl"></div>
<div class="flex justify-between items-center relative z-10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<h3 class="text-xl font-semibold text-on-surface tracking-tight">Smart Reminders</h3>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary shadow-sm"></div>
</label>
</div>
<p class="text-base text-on-surface-variant leading-relaxed mt-1 max-w-[90%] relative z-10">Gentle nudges that adapt to your context, avoiding times when you are deeply focused.</p>
</div>
<!-- Action Area -->
<div class="pt-8 pb-12 flex gap-4 items-center">
<button class="flex-1 bg-surface-container-highest text-on-surface font-semibold text-lg py-5 px-8 rounded-xl hover:bg-surface-variant transition-colors duration-400" type="button">Cancel</button>
<button class="flex-[2] signature-gradient text-on-primary font-bold text-lg py-5 px-8 rounded-xl ambient-shadow hover:opacity-90 transition-all duration-400" type="button">Create Routine</button>
</div>
</form>
</main>
<!-- Bottom Navigation for Mobile (Hidden on Web) -->
<!-- Suppressed on transactional/creation screen as per guidelines -->
</body></html>
