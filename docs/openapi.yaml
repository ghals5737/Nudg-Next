openapi: 3.0.3
info:
  title: Nudg API
  description: 개인 생산성 및 웰니스 앱 Nudg의 REST API
  version: 1.0.0

servers:
  - url: http://localhost:4000/api
    description: 로컬 개발 서버
  - url: https://api.nudg.app/api
    description: 프로덕션 서버

tags:
  - name: Auth
    description: 인증 / 세션
  - name: Dashboard
    description: 홈 대시보드 요약
  - name: Goals
    description: 장기 목표 관리
  - name: Routines
    description: 일일 루틴 / 습관 관리
  - name: Schedule
    description: 플래너 타임블록 관리
  - name: CBT
    description: 감정 기록 (CBT)
  - name: User
    description: 사용자 프로필 및 설정

# ─────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─────────────────────────────────────────────
  # Reusable schemas
  # ─────────────────────────────────────────────
  schemas:

    # ── Common ──────────────────────────────────
    ApiError:
      type: object
      required: [error, statusCode]
      properties:
        error:
          type: string
          example: "Resource not found"
        statusCode:
          type: integer
          example: 404

    # ── User ─────────────────────────────────────
    User:
      type: object
      required: [id, name, email, timezone, language, theme, notificationsEnabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "김민수"
        email:
          type: string
          format: email
          example: "minsu.kim@example.com"
        avatarUrl:
          type: string
          format: uri
          nullable: true
        timezone:
          type: string
          example: "Asia/Seoul"
        language:
          type: string
          example: "ko"
        theme:
          type: string
          enum: [light, dark, system]
        notificationsEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserSettings:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        language:
          type: string
          example: "ko"
        timezone:
          type: string
          example: "Asia/Seoul"
        notificationsEnabled:
          type: boolean

    # ── Auth ─────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: "김민수"
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    # ── Goals ────────────────────────────────────
    GoalStep:
      type: object
      required: [id, label, done, order]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: "독서 노트 작성"
        done:
          type: boolean
        order:
          type: integer
          minimum: 0

    Goal:
      type: object
      required: [id, userId, title, progress, steps, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
          example: "독서 습관 만들기"
        subtitle:
          type: string
          example: "50권 중 24권 읽음"
          nullable: true
        icon:
          type: string
          example: "menu_book"
        iconBg:
          type: string
          example: "#cce8e4"
        iconColor:
          type: string
          example: "#3d5653"
        progressColor:
          type: string
          example: "#006b64"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 48
        steps:
          type: array
          items:
            $ref: '#/components/schemas/GoalStep'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateGoalRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        subtitle:
          type: string
        icon:
          type: string
          example: "menu_book"
        iconBg:
          type: string
          example: "#cce8e4"
        iconColor:
          type: string
          example: "#3d5653"
        progressColor:
          type: string
          example: "#006b64"
        steps:
          type: array
          items:
            type: string
          example: ["두 번째 책 완독", "독서 노트 작성"]

    UpdateGoalRequest:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        icon:
          type: string
        iconBg:
          type: string
        iconColor:
          type: string
        progressColor:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100

    UpdateGoalStepRequest:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    # ── Routines ──────────────────────────────────
    Routine:
      type: object
      required: [id, userId, title, duration, time, days, active, smartReminders, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
          example: "아침 명상"
        icon:
          type: string
          example: "self_improvement"
        iconBg:
          type: string
          example: "#cce8e4"
        duration:
          type: integer
          description: 분 단위
          example: 15
        time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "07:00"
        days:
          type: array
          items:
            type: boolean
          minItems: 7
          maxItems: 7
          description: "월~일 순서 (index 0 = 월요일)"
          example: [true, true, true, true, true, false, false]
        active:
          type: boolean
        smartReminders:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RoutineWithRhythm:
      allOf:
        - $ref: '#/components/schemas/Routine'
        - type: object
          properties:
            rhythm:
              type: array
              items:
                type: boolean
              description: "최근 7일 완료 여부 (오래된 날부터)"
              example: [true, true, true, true, false, true, false]
            successRate:
              type: integer
              example: 71

    CreateRoutineRequest:
      type: object
      required: [title, duration, time, days]
      properties:
        title:
          type: string
        icon:
          type: string
        iconBg:
          type: string
        duration:
          type: integer
        time:
          type: string
          pattern: '^\d{2}:\d{2}$'
        days:
          type: array
          items:
            type: boolean
          minItems: 7
          maxItems: 7
        smartReminders:
          type: boolean
          default: true

    UpdateRoutineRequest:
      type: object
      properties:
        title:
          type: string
        icon:
          type: string
        iconBg:
          type: string
        duration:
          type: integer
        time:
          type: string
        days:
          type: array
          items:
            type: boolean
          minItems: 7
          maxItems: 7
        active:
          type: boolean
        smartReminders:
          type: boolean

    RoutineRhythmResponse:
      type: object
      required: [routineId, rhythm, successRate]
      properties:
        routineId:
          type: string
          format: uuid
        rhythm:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              completed:
                type: boolean
        successRate:
          type: integer
          minimum: 0
          maximum: 100

    # ── Schedule ─────────────────────────────────
    TaskTag:
      type: string
      enum: [업무, 개인, 심부름, 학습]

    TaskStatus:
      type: string
      enum: [pending, active, completed, snoozed]

    ScheduleBlock:
      type: object
      required: [id, userId, title, date, startTime, endTime, duration, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
          example: "프로젝트 기획서 작성"
        date:
          type: string
          format: date
          example: "2026-04-17"
        startTime:
          type: number
          description: "24시간 소수 표기 (예: 9.5 = 09:30)"
          example: 9.0
        endTime:
          type: number
          example: 10.5
        duration:
          type: number
          description: "시간 단위 소수 (예: 1.5 = 1시간 30분)"
          example: 1.5
        location:
          type: string
          nullable: true
          example: "홈 오피스"
        tag:
          $ref: '#/components/schemas/TaskTag'
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateScheduleBlockRequest:
      type: object
      required: [title, date, startTime, endTime, duration]
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: number
        endTime:
          type: number
        duration:
          type: number
        location:
          type: string
        tag:
          $ref: '#/components/schemas/TaskTag'

    UpdateScheduleBlockRequest:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: number
        endTime:
          type: number
        duration:
          type: number
        location:
          type: string
        tag:
          $ref: '#/components/schemas/TaskTag'
        status:
          $ref: '#/components/schemas/TaskStatus'

    SnoozeRequest:
      type: object
      required: [minutes]
      properties:
        minutes:
          type: integer
          example: 15

    # ── CBT ──────────────────────────────────────
    CBTEntry:
      type: object
      required: [id, userId, emoji, mood, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        emoji:
          type: string
          example: "😊"
        mood:
          type: string
          example: "안도"
        moodBg:
          type: string
          example: "#cce8e4"
        moodText:
          type: string
          example: "#3d5653"
        content:
          type: string
          example: "프로젝트 발표를 일찍 마쳤어요."
        tags:
          type: array
          items:
            type: string
          nullable: true
          example: ["심호흡", "성공"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCBTEntryRequest:
      type: object
      required: [emoji, mood, content]
      properties:
        emoji:
          type: string
        mood:
          type: string
        moodBg:
          type: string
        moodText:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string

    UpdateCBTEntryRequest:
      type: object
      properties:
        emoji:
          type: string
        mood:
          type: string
        moodBg:
          type: string
        moodText:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string

    # ── Dashboard ────────────────────────────────
    DashboardResponse:
      type: object
      required: [greeting, date, todayTasks, todayRoutines, routineProgress]
      properties:
        greeting:
          type: string
          example: "안녕하세요!"
        date:
          type: string
          format: date
        focusTask:
          $ref: '#/components/schemas/ScheduleBlock'
          nullable: true
        todayTasks:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBlock'
        todayRoutines:
          type: array
          items:
            type: object
            required: [routine, completed]
            properties:
              routine:
                $ref: '#/components/schemas/Routine'
              completed:
                type: boolean
        recentCBT:
          $ref: '#/components/schemas/CBTEntry'
          nullable: true
        routineProgress:
          type: object
          required: [completed, total]
          properties:
            completed:
              type: integer
            total:
              type: integer

  # ─────────────────────────────────────────────
  # Reusable responses
  # ─────────────────────────────────────────────
  responses:
    Unauthorized:
      description: 인증 토큰 없음 또는 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: "Unauthorized"
            statusCode: 401

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: "Resource not found"
            statusCode: 404

    BadRequest:
      description: 잘못된 요청 파라미터
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: "Validation failed"
            statusCode: 400

security:
  - bearerAuth: []

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ═══════════════════════════════════════════
  # Auth
  # ═══════════════════════════════════════════
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 사용 중인 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃 (서버 측 토큰 무효화)
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인된 사용자 조회
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════
  # Dashboard
  # ═══════════════════════════════════════════
  /dashboard:
    get:
      tags: [Dashboard]
      summary: 오늘의 대시보드 요약
      responses:
        '200':
          description: 대시보드 데이터
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════
  # Goals
  # ═══════════════════════════════════════════
  /goals:
    get:
      tags: [Goals]
      summary: 목표 목록 조회
      responses:
        '200':
          description: 목표 배열
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Goals]
      summary: 목표 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: 생성된 목표
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /goals/{goalId}:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Goals]
      summary: 목표 단건 조회
      responses:
        '200':
          description: 목표 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Goals]
      summary: 목표 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
      responses:
        '200':
          description: 수정된 목표
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Goals]
      summary: 목표 삭제
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals/{goalId}/steps/{stepId}:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stepId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Goals]
      summary: 목표 스텝 완료/미완료 토글
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalStepRequest'
      responses:
        '200':
          description: 스텝이 반영된 목표 전체 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════
  # Routines
  # ═══════════════════════════════════════════
  /routines:
    get:
      tags: [Routines]
      summary: 루틴 목록 조회 (최근 7일 리듬 포함)
      responses:
        '200':
          description: 루틴 배열
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoutineWithRhythm'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Routines]
      summary: 루틴 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineRequest'
      responses:
        '201':
          description: 생성된 루틴
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Routine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /routines/{routineId}:
    parameters:
      - name: routineId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Routines]
      summary: 루틴 단건 조회
      responses:
        '200':
          description: 루틴 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RoutineWithRhythm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Routines]
      summary: 루틴 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoutineRequest'
      responses:
        '200':
          description: 수정된 루틴
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Routine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Routines]
      summary: 루틴 삭제
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routines/{routineId}/toggle:
    parameters:
      - name: routineId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Routines]
      summary: 루틴 활성/비활성 토글
      responses:
        '200':
          description: 토글된 루틴
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Routine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routines/{routineId}/log:
    parameters:
      - name: routineId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Routines]
      summary: 루틴 완료 기록 (당일)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  format: date
                  example: "2026-04-17"
      responses:
        '200':
          description: 기록 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routines/{routineId}/rhythm:
    parameters:
      - name: routineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: days
        in: query
        schema:
          type: integer
          default: 7
          minimum: 1
          maximum: 90
        description: 조회할 과거 일수

    get:
      tags: [Routines]
      summary: 루틴 완료 리듬 조회
      responses:
        '200':
          description: 리듬 데이터
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RoutineRhythmResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════
  # Schedule
  # ═══════════════════════════════════════════
  /schedule:
    get:
      tags: [Schedule]
      summary: 특정 날짜의 타임블록 목록 조회
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-04-17"
      responses:
        '200':
          description: 타임블록 배열 (startTime 오름차순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Schedule]
      summary: 타임블록 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleBlockRequest'
      responses:
        '201':
          description: 생성된 타임블록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /schedule/{blockId}:
    parameters:
      - name: blockId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Schedule]
      summary: 타임블록 단건 조회
      responses:
        '200':
          description: 타임블록 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleBlock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Schedule]
      summary: 타임블록 수정 (상태 변경 포함)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleBlockRequest'
      responses:
        '200':
          description: 수정된 타임블록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleBlock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Schedule]
      summary: 타임블록 삭제
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /schedule/{blockId}/snooze:
    parameters:
      - name: blockId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Schedule]
      summary: 타임블록 미루기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnoozeRequest'
      responses:
        '200':
          description: startTime/endTime이 조정된 타임블록
